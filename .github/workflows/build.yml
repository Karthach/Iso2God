name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Iso2God
        run: dotnet build Iso2God.sln --configuration Release
      - name: Package release
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net481'
          $files = @('Iso2God.exe', 'gamelist_xbox.csv', 'gamelist_xbox360.csv', 'xextool.exe')
          foreach ($file in $files) {
            $path = Join-Path $output $file
            if (-not (Test-Path $path)) {
              throw "Expected release file was not built: $path"
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP 'iso2god-v1.6.2.zip'
          Compress-Archive -Path ($files | ForEach-Object { Join-Path $output $_ }) -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Iso2God-v1.6.2
          path: ${{ runner.temp }}/iso2god-v1.6.2.zip
          if-no-files-found: error
